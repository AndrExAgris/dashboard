services:
  painel:
    build: .
    container_name: painel
    ports:
      - "3000:3000"
    volumes:
      # A pasta inteira, não arquivo por arquivo: assim salvar o YAML
      # pelo editor nunca deixa o container com a versão antiga
      - ./dados:/app/data:ro
      # /proc do host: a rede é lida de /host/proc/1/net/dev
      - /proc:/host/proc:ro
      # Raiz do host para os discos. rslave faz um HD montado depois
      # que o container subiu aparecer aqui também
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          propagation: rslave
    environment:
      - HOST_PROC=/host/proc
      - HOST_ROOT=/host/root
    restart: unless-stopped
    # Continua na rede própria: só o monitor lê a rede do host
    networks:
      - painel-net

networks:
  painel-net:
    driver: bridge
